name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  image:
    name: Build image and run API tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # pdfinfo/pdftotext: the API tests check page order and text with them (skipped without)
      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - uses: docker/setup-buildx-action@v4

      # lint and unit tests run inside the build (Dockerfile, build stage)
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pedef:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: API tests
        run: test/api/run-against-image.sh pedef:ci
